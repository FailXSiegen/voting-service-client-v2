# Cache policy per URI. Set via map + one server-level add_header, because nginx drops all
# inherited add_header directives as soon as a location defines its own add_header. This way
# the security headers below reach every response (HTML, assets, manual videos, 404s).
map $uri $vt_cache_control {
    default                                                     "no-cache";
    ~*^/hilfe/                                                  "public, max-age=86400";
    ~*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$   "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Without "always": error responses (404 etc.) must not be cached for a year.
    add_header Cache-Control $vt_cache_control;

    # Security headers (SEC-28). Do NOT add add_header inside a location, see above.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    # Camera/microphone/screen sharing for Zoom (own origin) and Jitsi (iframe of meet.jit.si).
    add_header Permissions-Policy "camera=(self \"https://meet.jit.si\"), microphone=(self \"https://meet.jit.si\"), display-capture=(self \"https://meet.jit.si\"), fullscreen=(self \"https://meet.jit.si\"), autoplay=(self \"https://meet.jit.si\"), clipboard-write=(self \"https://meet.jit.si\"), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), hid=(), midi=(), magnetometer=(), gyroscope=(), accelerometer=(), browsing-topics=()" always;

    # Enforced CSP: the XSS-relevant directives.
    # - script-src: own origin plus the hosts the client loads scripts from (Zoom SDK, Jitsi
    #   external_api.js, mosparo). 'unsafe-eval' stays until the Report-Only policy below shows
    #   that the Zoom Meeting SDK works without it (its bundles contain eval/new Function);
    #   'wasm-unsafe-eval' is needed for the Zoom audio/video WebAssembly. No 'unsafe-inline':
    #   injected inline scripts and on*-handlers are blocked.
    # - Further Jitsi/mosparo hosts (VITE_JITSI_ALLOWED_HOSTS / VITE_MOSPARO_ALLOWED_HOSTS) must
    #   be added here as well (script-src, and frame-src/connect-src below).
    add_header Content-Security-Policy "script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' blob: https://source.zoom.us https://dmogdx0jrul3u.cloudfront.net https://meet.jit.si https://captcha.failx.de; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Full strict policy as Report-Only until it has been checked in the browser console with
    # Zoom, Jitsi, mosparo and the CMS pages (violations only show up as console warnings).
    # Once clean: move it into the enforced header above.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob: https://source.zoom.us https://dmogdx0jrul3u.cloudfront.net https://meet.jit.si https://captcha.failx.de; style-src 'self' 'unsafe-inline' https://source.zoom.us https://captcha.failx.de; font-src 'self' data: https://source.zoom.us; img-src 'self' data: blob: https:; media-src 'self' blob: mediastream: https://*.zoom.us; connect-src 'self' https://*.zoom.us wss://*.zoom.us https://*.zoom.com wss://*.zoom.com https://dmogdx0jrul3u.cloudfront.net https://meet.jit.si wss://meet.jit.si https://captcha.failx.de; frame-src 'self' https://meet.jit.si https://*.zoom.us; worker-src 'self' blob:; child-src 'self' blob: https://meet.jit.si; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Prerendered start page for crawlers; the Vue app takes over on load.
    location = / {
        try_files /start.html /index.html;
    }

    # Manual videos (stable names): one day of caching via $vt_cache_control.
    location /hilfe/ {
        access_log off;
    }

    # Vue.js SPA routing. HTML gets "no-cache" via $vt_cache_control, otherwise browsers keep
    # an old client after a deploy.
    location / {
        try_files $uri $uri.html /index.html;
    }

    # Static assets: cached for a year via $vt_cache_control.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        access_log off;
    }

    # Health check endpoint
    location /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Disable access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.(conf|log)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
