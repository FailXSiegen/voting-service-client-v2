server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Prerendered start page for crawlers; the Vue app takes over on load.
    location = / {
        try_files /start.html /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }

    # Manual videos: stable names, so a day of caching and no immutable.
    location /hilfe/ {
        expires 1d;
        access_log off;
    }

    # Vue.js SPA routing
    location / {
        try_files $uri $uri.html /index.html;
        # HTML must revalidate, otherwise browsers keep an old client after a deploy.
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Disable access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.(conf|log)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}